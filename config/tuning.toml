# tuning.toml
# Developer game constants for Cenotaph: The Great Omission
#
# All gameplay values that designers can tweak without touching code.
# These values are loaded at startup and drive the entire game experience.

[player]
# Health and stamina
max_health = 100.0
max_stamina = 100.0
stamina_regen_rate = 10.0  # per second
stamina_regen_delay = 1.0  # seconds before regen starts after depletion

# Movement speeds (units per second)
walk_speed = 3.0
sprint_speed = 8.0

[movement]
# Dash mechanics
dash_speed_multiplier = 2.0  # how much faster dash is compared to sprint
dash_stamina_cost = 25.0
dash_cooldown = 2.0  # seconds between dashes
dash_duration = 0.5  # seconds

# Sprint mechanics
sprint_stamina_drain_rate = 20.0  # per second

[camera]
# Mouse look sensitivity
sensitivity = 0.002

[physics]
# World physics
gravity = -9.8
jump_velocity = 5.0
player_speed = 5.0

[combat]
# Weapon and damage
base_damage = 25.0
crit_multiplier = 2.0
primary_fire_range = 80.0
attack_cooldown = 0.25
miss_cooldown = 0.15
enemy_hit_radius = 2.0
enemy_hit_stun = 0.12
hurtbox_damage_per_second = 15.0
hurtbox_radius = 3.0
hurtbox_tick_interval = 0.5
respawn_delay = 3.0

[world]
# Level loading
draw_distance = 500.0
fog_density = 0.01

# Anchor rites
anchor_interaction_radius = 2.75
anchor_mend_cost = 25

[lighting]
# Environment
ambient_color = [0.1, 0.1, 0.15]
sun_color = [1.0, 0.8, 0.5]
sun_intensity = 2.0
sun_position_offset = 5.0  # height above player

# HUD palette. Widgets use semantic names so you can retheme the interface
# without changing layout code. Values are RGBA in the 0.0 to 1.0 range.
[ui.hud]
void = [0.008, 0.009, 0.010, 0.78]
surface = [0.026, 0.028, 0.030, 0.72]
surface_raised = [0.065, 0.062, 0.055, 0.82]
line = [0.42, 0.40, 0.36, 0.34]
bone = [0.88, 0.85, 0.77, 0.94]
bone_dim = [0.58, 0.57, 0.53, 0.68]
ash = [0.43, 0.49, 0.52, 0.76]
gold = [0.76, 0.57, 0.25, 0.88]
gold_bright = [1.00, 0.78, 0.34, 0.96]
cold = [0.30, 0.70, 0.78, 0.90]
blood = [0.72, 0.13, 0.09, 0.92]
ember = [1.00, 0.38, 0.08, 0.94]
stamina = [0.78, 0.68, 0.30, 0.90]
success = [0.32, 0.72, 0.49, 0.90]

# Visual profiles are presentation-only. Change these to retheme models without
