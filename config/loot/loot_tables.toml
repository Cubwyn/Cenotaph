# Loot Table Configuration
# Based on Cenotaph design document rarity system

[common_loot]
items = [
    { item = "health_pack", chance = 0.5, min_count = 1, max_count = 3 },
    { item = "ammo", chance = 0.8, min_count = 5, max_count = 20 },
    { item = "scrap_metal", chance = 0.3, min_count = 1, max_count = 5 },
    { item = "basic_parts", chance = 0.2, min_count = 1, max_count = 2 }
]

[uncommon_loot]
items = [
    { item = "weapon_part", chance = 0.2, min_count = 1, max_count = 1 },
    { item = "health_pack", chance = 0.8, min_count = 2, max_count = 5 },
    { item = "ammo", chance = 0.9, min_count = 10, max_count = 30 },
    { item = "medium_parts", chance = 0.15, min_count = 1, max_count = 1 }
]

[rare_loot]
items = [
    { item = "artifact", chance = 0.05, min_count = 1, max_count = 1 },
    { item = "weapon_part", chance = 0.4, min_count = 1, max_count = 2 },
    { item = "special_ammo", chance = 0.1, min_count = 5, max_count = 15 },
    { item = "rare_parts", chance = 0.1, min_count = 1, max_count = 1 }
]

[epic_loot]
items = [
    { item = "legendary_weapon", chance = 0.01, min_count = 1, max_count = 1 },
    { item = "artifact", chance = 0.15, min_count = 1, max_count = 3 },
    { item = "rare_material", chance = 0.25, min_count = 5, max_count = 10 },
    { item = "epic_parts", chance = 0.05, min_count = 1, max_count = 1 }
]

[legendary_loot]
items = [
    { item = "mythical_weapon", chance = 0.001, min_count = 1, max_count = 1 },
    { item = "legendary_artifact", chance = 0.02, min_count = 1, max_count = 1 },
    { item = "legendary_material", chance = 0.1, min_count = 10, max_count = 20 },
    { item = "legendary_parts", chance = 0.02, min_count = 1, max_count = 2 }
]

