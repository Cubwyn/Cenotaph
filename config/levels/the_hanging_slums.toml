# The Hanging Slums Level Configuration
# Based on existing level data and design document

[level_info]
name = "The Hanging Slums"
difficulty = 2
required_level = 1

[environment]
gravity_multiplier = 1.0
wind_strength = 0.5
fog_density = 0.05
fog_color = [0.1, 0.1, 0.15]
lighting_intensity = 0.6

[vertical_design]
min_height = 6.0
max_height = 42.0
min_x = -80.0
max_x = 80.0
min_z = -80.0
max_z = 80.0

[spawn_points]
default = [0.0, 10.0, 0.0]
checkpoints = [
    [0.0, 15.0, 0.0],
    [20.0, 20.0, -10.0],
    [40.0, 25.0, -20.0],
    [0.0, 30.0, 0.0]
]

[enemies]
spawn_rate = 1.0
difficulty_scaling = 1.1
patrol_density = 3
alert_radius = 25.0

[enemy_types]
burdened = { weight = 8, max_concurrent = 3, spawn_height = "ground" }
paranoiac = { weight = 5, max_concurrent = 2, spawn_height = "mid" }

[loot]
common_drop_rate = 0.8
uncommon_drop_rate = 0.3
rare_drop_rate = 0.05
epic_drop_rate = 0.01

[loot_spawns]
health_packs = { count = 8, spawn_weight = 15, height_preference = "ground" }
ammo = { count = 15, spawn_weight = 20, height_preference = "mid" }
weapon_parts = { count = 4, spawn_weight = 8, height_preference = "high" }

[hazards]
fall_damage_multiplier = 2.0
environmental_damage_per_second = 0.0

[hazard_zones]
spike_trap = { x = 0.0, y = 6.0, z = 0.0, radius = 3.0, damage = 15 }
crushing_wall = { x = 30.0, y = 18.0, z = -15.0, radius = 2.0, damage = 20 }

[traversal]
climbable_props = 65
vertical_shortcuts = 5
dangerous_jumps = 8
hidden_paths = 4
puzzle_elements = 1

[audio]
ambient_track = "assets/audio/music/hanging_slums_theme.wav"
combat_music = "assets/audio/music/combat_theme.wav"

[ambient_sounds]
wind = "assets/audio/ambient/wind.wav"
dripping = "assets/audio/ambient/dripping.wav"
wood_creak = "assets/audio/ambient/wood_creak.wav"
distant_bells = "assets/audio/ambient/distant_bells.wav"

[visual_effects]
dust = { x = 0.0, y = 10.0, z = 0.0, intensity = 0.8 }
wood_chips = { x = 20.0, y = 15.0, z = -10.0, intensity = 0.5 }

[lighting_effects]
shaft_light = { x = 0.0, y = 40.0, z = 0.0, color = [0.8, 0.9, 1.0] }

[bell_system]
location = [0.0, 38.0, 0.0]
radius = 80.0
effects = ["reveal_omitted_objects", "unlock_new_paths", "change_lighting", "alter_enemy_spawns"]

[performance]
max_draw_distance = 100.0
lod_bias = 1.0
particle_limit = 30
physics_substeps = 2
max_active_enemies = 10
