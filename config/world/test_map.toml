# test_map.toml
# Underground test map configuration for Cenotaph

[map]
name = "The Forgotten Spire"
version = "0.03"
description = "Underground test map using only Cube.obj"

[spawn]
default_position = [0.0, 5.0, 0.0]

[environment]
gravity = 9.8
ambient_light = [0.1, 0.1, 0.15]
fog_density = 0.05
fog_color = [0.1, 0.1, 0.15]

[features]
resonance_test = "bell_fragment"