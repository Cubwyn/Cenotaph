# bindings.toml
# User-editable key bindings for Cenotaph: The Great Omission
# 
# This file controls what keyboard keys trigger each action.
# Edit these values to rebind controls.

[keybindings]
# Movement
forward = "W"
backward = "S"
left = "A"
right = "D"
jump = "SPACE"
sprint = "SHIFT"

# Actions
dash = "Q"
attack = "MOUSE_LEFT"
interact = "E"
inventory = "I"
pause = "ESCAPE"

# Debug / test controls
debug_help = "F1"
debug_heal_player = "F2"
debug_damage_player = "F3"
debug_set_player_low_health = "F4"
debug_reload_level = "F5"
debug_respawn_loot = "F6"
debug_spawn_ashbound = "F7"
debug_spawn_burdened = "F8"
debug_spawn_censer = "F9"
debug_spawn_chainrunner = "F10"
debug_spawn_harpy = "F11"
debug_clear_enemies = "F12"
