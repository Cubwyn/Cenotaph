# Enemy Registry - Add new enemies here to make them available
# Based on Cenotaph design document factions

[burdened]
file = "burdened.toml"
unlock_level = 1
spawn_weight = 10
description = "Stone-carrying husks. Slow but high impact."

[silencer]
file = "silencer.toml"
unlock_level = 3
spawn_weight = 5
description = "Tall figures with gold-wire mouths. Suppresses abilities."

[paranoiac]
file = "paranoiac.toml"
unlock_level = 5
spawn_weight = 3
description = "Cage-headed screamers. Alerts entire zones."

[harpy]
file = "harpy.toml"
unlock_level = 4
spawn_weight = 4
description = "Marble angel statues with decayed wings."

