# The Silencers - Tall figures with mouths sewn shut in gold wire
# Design Document: Suppress player abilities temporarily, anti-magic, silence mechanics

[base]
name = "The Silencer"
description = "Tall figures with mouths sewn shut in gold wire that suppress player abilities"

[stats]
health = 120
damage = 20
speed = 3.5
armor = 5

[combat]
attack_range = 8.0
attack_cooldown = 1.5

[loot]
table = "uncommon"
experience_value = 100
rare_drop_chance = 0.08

[assets]
model_path = "assets/enemies/silencer.obj"
texture_path = "assets/enemies/silencer.png"

[audio]
sound_path = "assets/audio/enemies/silencer.wav"
footstep_sound = "assets/audio/enemies/quiet_steps.wav"
ambient_sound = "assets/audio/enemies/silence_hum.wav"

[ai]
patrol_radius = 20.0
alert_radius = 30.0
flee_health_threshold = 0.3

[abilities]
list = ["silence_field", "teleport_short", "summon_omitted"]

[environment]
destructible = true
can_break_props = false
triggers_traps = true

[scaling]
health_multiplier_per_level = 1.10
damage_multiplier_per_level = 1.05
speed_multiplier_per_level = 1.02

[requirements]
unlock_level = 3
min_player_level = 2
