# Enemy Configuration Template
# Copy this file for new enemy types
# Based on Cenotaph design document factions

[base]
name = "NEW_ENEMY_NAME"
description = "Brief description of enemy behavior and role"

[stats]
health = 100
damage = 25
speed = 3.0
armor = 0

[combat]
attack_range = 10.0
attack_cooldown = 1.5

[loot]
table = "common"
experience_value = 50
rare_drop_chance = 0.05

[assets]
model_path = "assets/enemies/new_enemy.obj"
texture_path = "assets/enemies/new_enemy.png"

[audio]
sound_path = "assets/audio/enemies/new_enemy.wav"
footstep_sound = "assets/audio/enemies/footsteps.wav"
ambient_sound = "assets/audio/enemies/ambient.wav"

[ai]
patrol_radius = 15.0
alert_radius = 25.0
flee_health_threshold = 0.2

[abilities]
list = ["teleport_short", "summon_minions"]

[environment]
destructible = true
can_break_props = false
triggers_traps = false

[scaling]
health_multiplier_per_level = 1.1
damage_multiplier_per_level = 1.05
speed_multiplier_per_level = 1.02

[requirements]
unlock_level = 1
min_player_level = 1
