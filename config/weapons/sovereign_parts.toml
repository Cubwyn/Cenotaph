# Sovereign Weapon Parts - Heavy impact, gravity distortion, environmental shockwaves
# Design Document: Philosophy of Authority, Control

[heavy_barrel]
[heavy_barrel.part_info]
name = "Gravity Barrel"
type = "barrel"
rarity = "rare"
description = "Projects gravity-distorting rounds"
philosophy = "authority"
faction = "sovereign"

[heavy_barrel.stats]
