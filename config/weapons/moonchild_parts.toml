# Moonchild Weapon Parts - Homing projectiles, light-elemental effects, delayed impact pulses
# Design Document: Philosophy of Guidance, Illumination

[homing_barrel]
[homing_barrel.part_info]
name = "Guiding Barrel"
type = "barrel"
rarity = "uncommon"
description = "Projects homing energy bolts"
philosophy = "guidance"
faction = "moonchild"

[homing_barrel.stats]
damage_modifier = 1.2
fire_rate_modifier = 0.8
accuracy_modifier = 1.5
stamina_cost_modifier = 1.1

[homing_barrel.effects]
projectile_type = "homing"

[homing_barrel.moonchild_effects]
list = ["target_lock", "energy_trail"]

[homing_barrel.visuals]
color = [0.2, 0.8, 1.0]
glow_color = [0.0, 0.5, 1.0]
emission_strength = 0.5

[homing_barrel.audio]
fire_sound = "assets/audio/weapons/moonchild_fire.wav"

[homing_barrel.requirements]
level_requirement = 3

[homing_barrel.compatibility]
max_per_category = 1

