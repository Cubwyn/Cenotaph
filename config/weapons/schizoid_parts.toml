# Schizoid Weapon Parts - High fire rate, split trajectories, chaotic recoil
# Design Document: Philosophy of Fragmentation, Instability

[short_barrel]
[short_barrel.part_info]
name = "Fractured Barrel"
type = "barrel"
rarity = "common"
description = "Splits projectiles into multiple fragments"
philosophy = "fragmentation"
faction = "schizoid"

[short_barrel.stats]
damage_modifier = 0.8
fire_rate_modifier = 1.5
accuracy_modifier = 0.6
stamina_cost_modifier = 1.2

[short_barrel.effects]
projectile_type = "split"

[short_barrel.schizoid_effects]
list = ["chaotic_recoil", "fragment_spread"]

[short_barrel.visuals]
color = [0.8, 0.2, 0.2]

[short_barrel.audio]
fire_sound = "assets/audio/weapons/schizoid_fire.wav"

[short_barrel.requirements]
level_requirement = 1

[short_barrel.compatibility]
max_per_category = 1

