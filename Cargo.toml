[package]
name = "cenotaph"
version = "0.1.0"
edition = "2021"

# ── Feature flags ─────────────────────────────────────────────────────────────
[dependencies]
winit = "0.30"
wgpu = "28.0.0"
glam = "0.32"
rapier3d = "0.32.0"
bytemuck = { version = "1.16", features = ["derive"] }
tobj = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"
getrandom = "0.3.4"
env_logger = "0.11"
pollster = "0.4.0"
image = "0.25"
gltf = { version = "1.4", features = ["extras"] }
rodio = "0.20"
